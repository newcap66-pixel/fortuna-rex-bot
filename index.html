<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fortuna Rex — Bônus até R$9.500</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
  background: #0A0A1A;
  color: #fff;
  max-width: 430px;
  margin: 0 auto;
  overflow-x: hidden;
  padding-bottom: 90px;
}

/* Главное изображение */
.hero-img {
  width: 100%;
  display: block;
}

/* Фиксированная кнопка снизу */
.fixed-cta {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  z-index: 100;
  padding: 10px 16px 16px;
  background: linear-gradient(to top, #0A0A1A 80%, transparent);
}

.btn-main {
  display: block;
  width: 100%;
  background: linear-gradient(135deg, #00C853, #00E676);
  color: #000;
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  font-weight: 900;
  text-align: center;
  padding: 16px 20px 12px;
  border-radius: 14px;
  text-decoration: none;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 30px rgba(0,200,83,0.5);
  border: none;
  cursor: pointer;
  margin-bottom: 8px;
}

.btn-main span {
  display: block;
  font-size: 11px;
  font-weight: 400;
  opacity: 0.8;
  margin-top: 2px;
}

.btn-telegram {
  display: block;
  width: 100%;
  background: linear-gradient(135deg, #5B4FCF, #7B68EE);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  padding: 13px 20px;
  border-radius: 12px;
  text-decoration: none;
  box-shadow: 0 4px 20px rgba(91,79,207,0.4);
}

/* Кнопка копирования промокода */
.promo-section {
  background: #0A0A1A;
  padding: 20px 16px;
  text-align: center;
}

.promo-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,215,0,0.08);
  border: 2px dashed rgba(255,215,0,0.5);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
}

.promo-text {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}

.promo-code {
  font-size: 22px;
  font-weight: 900;
  color: #FFD700;
  letter-spacing: 3px;
}

.copy-btn {
  background: #00C853;
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}

.copy-btn.copied {
  background: #FFD700;
}

/* Таймер поверх картинки */
.timer-overlay {
  background: #0A0A1A;
  padding: 16px;
  text-align: center;
  border-bottom: 1px solid rgba(255,215,0,0.15);
}

.timer-label {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.timer-digits {
  display: flex;
  justify-content: center;
  gap: 8px;
  align-items: center;
}

.timer-block {
  background: rgba(255,0,0,0.15);
  border: 1px solid rgba(255,0,0,0.3);
  border-radius: 10px;
  padding: 10px 16px;
  min-width: 64px;
}

.timer-num {
  font-size: 30px;
  font-weight: 900;
  color: #FF4444;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.timer-unit {
  font-size: 9px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}

.timer-sep {
  font-size: 28px;
  font-weight: 900;
  color: #FF4444;
  margin-bottom: 16px;
}

/* Онлайн */
.online-bar {
  background: rgba(0,200,83,0.08);
  border-top: 1px solid rgba(0,200,83,0.2);
  border-bottom: 1px solid rgba(0,200,83,0.2);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: #00E676;
}

.dot {
  width: 8px;
  height: 8px;
  background: #00E676;
  border-radius: 50%;
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.2; }
}

/* Popup при копировании */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #00C853;
  color: #000;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.toast.show { opacity: 1; }
</style>
</head>
